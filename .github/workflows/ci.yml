name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Run TypeScript type-check and linter
        run: npm run lint

      - name: Run unit test suite with coverage
        run: npm run test:coverage

      - name: Benchmark garden geometry cache
        run: npm run bench:garden-geometry

      - name: Build production bundle
        run: npm run build

  server-test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r server/requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit -r server/requirements-dev.txt

      - name: Run server pytest
        run: |
          cd server
          pytest -q test_main.py

      - name: Verify server Docker build (retry transient registry throttling)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker build -t kulv-server:ci ./server; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed (attempt $attempt/3); retrying after a short delay."
              sleep $((attempt * 15))
            fi
          done
          echo "Docker build failed after 3 attempts."
          exit 1

  garden-canvas-frame-performance:
    # Compare against the parent of the prior GardenCanvas optimization, using the
    # same real-browser probe and runner so frame timing is measured apples-to-apples.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install current dependencies
        run: npm ci

      - name: Build pre-optimization baseline and install browser
        env:
          PERF_BASELINE_SHA: 14865b0e49bfddc8737ee9c5f76a40728655fc5b
        run: |
          git fetch --no-tags origin "$PERF_BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/kulv-canvas-before" "$PERF_BASELINE_SHA"
          mkdir -p "$RUNNER_TEMP/kulv-canvas-before/performance"
          cp performance/garden-canvas-frame-probe.pw.ts "$RUNNER_TEMP/kulv-canvas-before/performance/"
          cp playwright.performance.config.ts "$RUNNER_TEMP/kulv-canvas-before/"
          cd "$RUNNER_TEMP/kulv-canvas-before"
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Measure pre-optimization production drag frames
        env:
          GARDEN_PERF_RESULT_PATH: ${{ runner.temp }}/garden-canvas-before.json
        run: |
          cd "$RUNNER_TEMP/kulv-canvas-before"
          npx playwright test --config=playwright.performance.config.ts

      - name: Build optimized production bundle
        run: npm run build

      - name: Measure optimized production drag frames
        env:
          GARDEN_PERF_RESULT_PATH: ${{ runner.temp }}/garden-canvas-after.json
        run: npx playwright test --config=playwright.performance.config.ts

      - name: Compare observed drag smoothness
        run: node scripts/compare-garden-canvas-performance.mjs "$RUNNER_TEMP/garden-canvas-before.json" "$RUNNER_TEMP/garden-canvas-after.json"

      - name: Upload GardenCanvas frame timing reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: garden-canvas-frame-timing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/garden-canvas-before.json
            ${{ runner.temp }}/garden-canvas-after.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-browser-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run browser E2E suite
        run: npm run test:e2e

      - name: Upload responsive UI screenshots and browser diagnostics
        if: always()
        continue-on-error: true # GitHub-hosted artifact storage can be full; browser tests remain authoritative.
        uses: actions/upload-artifact@v4
        with:
          name: kulv-ui-visual-review-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

