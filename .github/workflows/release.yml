name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  verify-and-release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit & Server Tests
        run: |
          npm test
          npm run test:server

      - name: Audit gate
        run: npm run audit:ci

      - name: Build production bundle
        run: npm run build

      - name: Package client distribution
        run: |
          tar -czvf kulv-dist-${{ github.ref_name || inputs.tag_name }}.tar.gz -C dist .

      - name: Build & Verify Docker container
        run: |
          docker build -t kulv:${{ github.ref_name || inputs.tag_name }} .
          docker save kulv:${{ github.ref_name || inputs.tag_name }} | gzip > kulv-container-${{ github.ref_name || inputs.tag_name }}.tar.gz

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ github.ref_name || inputs.tag_name }}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Release ${{ steps.notes.outputs.tag }}
          generate_release_notes: true
          files: |
            kulv-dist-${{ steps.notes.outputs.tag }}.tar.gz
            kulv-container-${{ steps.notes.outputs.tag }}.tar.gz
