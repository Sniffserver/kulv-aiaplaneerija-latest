  <!-- Left Leaf -->
  <path d="M258 270 C200 265 140 210 160 150 C210 145 255 195 258 270 Z" fill="url(#leaf)"/>
  
  <!-- Right Leaf -->
  <path d="M262 220 C320 205 375 140 345 90 C290 100 265 160 262 220 Z" fill="url(#leaf)"/>
